<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>RankBox home pane harness</title>
    <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Big+Shoulders+Display:wght@700;800;900&family=Instrument+Sans:wght@400;500;600;700&display=swap" />
    <style>
      /* dev-only stand-in for Jellyfin's home screen, to see the pane in context */
      body { margin: 0; min-height: 100vh; color: #fff; font: 15px/1.4 'Noto Sans', 'Segoe UI', sans-serif;
        background: radial-gradient(60% 50% at 30% 20%, #5a3b6b, transparent), radial-gradient(50% 60% at 80% 30%, #2d4a6b, transparent), #1a1625; }
      header { display: flex; gap: 24px; align-items: center; padding: 14px 3.3%; font-size: 13px; background: rgba(0,0,0,.25); }
      .homeSectionsContainer { padding-top: 40px; }
      .verticalSection { padding: 0 3.3%; margin-bottom: 2em; }
      .sectionTitle { font-size: 18px; font-weight: 600; margin: 0 0 10px; }
      .cards { display: flex; gap: 10px; }
      .cards div { width: 250px; height: 125px; border-radius: 8px; background: rgba(255,255,255,.15); }
    </style>
  </head>
  <body>
    <header><b>Rig</b><span>♥ Favorites</span><span>🎬 Movies</span><span>🖥 Shows</span><span>▤ RankBox</span></header>
    <div class="homeSectionsContainer">
      <div class="verticalSection section0"><h2 class="sectionTitle">My Media</h2><div class="cards"><div></div><div></div></div></div>
      <div id="slot"></div>
      <div class="verticalSection"><h2 class="sectionTitle">Continue Watching</h2><div class="cards"><div></div></div></div>
    </div>
    <script type="module" src="./src/harness.ts"></script>
  </body>
</html>
