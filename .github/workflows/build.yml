name: build

on:
  push:
    branches: [main, v2]
    tags: ['v*']
  pull_request:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: web/package-lock.json

      - name: Web app (tests + build)
        working-directory: web
        run: |
          npm ci --no-fund --no-audit
          npm test
          npm run build

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'

      - name: Build
        run: dotnet build Jellyfin.Plugin.RankBox -c Release -p:UseNuget=true -o out

      - name: Package
        run: |
          VERSION=$(grep -oP '(?<=<AssemblyVersion>)[^<]+' Jellyfin.Plugin.RankBox/Jellyfin.Plugin.RankBox.csproj)
          mkdir -p pkg
          cp out/Jellyfin.Plugin.RankBox.dll pkg/
          cat > pkg/meta.json <<EOF
          {
            "category": "General",
            "description": "Rank your shows and movies by comparing them head to head.",
            "guid": "022bcb7f-e929-4aa7-80d9-b63080a92b36",
            "name": "RankBox",
            "overview": "Rank shows and movies head to head: scores, tiers, recency checks, insights, share cards and a Jellyfin home pane.",
            "owner": "Ashen00001",
            "targetAbi": "12.1.0.0",
            "version": "$VERSION",
            "status": "Active",
            "autoUpdate": false,
            "assemblies": []
          }
          EOF
          (cd pkg && zip -r ../rankbox_$VERSION.zip .)
          md5sum rankbox_$VERSION.zip
          echo "VERSION=$VERSION" >> $GITHUB_ENV

      - uses: actions/upload-artifact@v4
        with:
          name: rankbox_${{ env.VERSION }}
          path: rankbox_${{ env.VERSION }}.zip

      - name: Release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: rankbox_${{ env.VERSION }}.zip
          generate_release_notes: true
